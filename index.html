<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hobby Class 3D</title>
<style>
  /* Layout: full-bleed WebGL canvas with one floating control card (top-left) and a hint strip (bottom-left). */
  :root {
    --bg: #e9ecef;          /* cool grey ground, matches the drawing sheet */
    --fg: #1c1f24;
    --mut: #5e6670;
    --card: rgba(255,255,255,0.92);
    --line: #cfd5dc;
    --accent: #1f4e79;      /* drawing-ink blue used on the plan sheets */
    --btn: #ffffff;
    --btn-hover: #f1f4f7;
    --font-ui: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#14171b; --fg:#e8ebee; --mut:#9aa3ad; --card:rgba(28,32,37,0.92); --line:#3a4149; --accent:#7fb2e5; --btn:#242930; --btn-hover:#2f353d; color-scheme: dark }
  }
  :root[data-theme="dark"] { --bg:#14171b; --fg:#e8ebee; --mut:#9aa3ad; --card:rgba(28,32,37,0.92); --line:#3a4149; --accent:#7fb2e5; --btn:#242930; --btn-hover:#2f353d; color-scheme: dark }

  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px; overflow: hidden; position: relative; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; }

  #ui { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; width: 232px; max-width: calc(100% - 32px);
        background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        backdrop-filter: blur(6px); }
  #ui header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; cursor: pointer; }
  #ui h1 { font-size: 14px; margin: 0; letter-spacing: 0.01em; }
  #ui .sub { color: var(--mut); font-size: 11px; margin-top: 2px; }
  #ui header button { border: 0; background: transparent; color: var(--mut); font-size: 16px; line-height: 1; cursor: pointer; padding: 4px; border-radius: 6px; }
  #ui header button:focus-visible, #ui .row button:focus-visible, #ui input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #body { padding: 2px 12px 12px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  #body[hidden] { display: none; }
  #body label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  #body input[type=range] { width: 100px; margin-left: auto; accent-color: var(--accent); }
  #body input[type=checkbox] { accent-color: var(--accent); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .row button { border: 1px solid var(--line); background: var(--btn); color: var(--fg); border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .row button:hover { background: var(--btn-hover); }
  .row button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .eyebrow { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mut); margin-top: 6px; }
  #help { position: absolute; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 16px; background: var(--card); border: 1px solid var(--line);
          border-radius: 8px; padding: 7px 11px; font-size: 12px; color: var(--mut); }
  #load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--mut); pointer-events: none; }
  @media (max-width: 600px) { #help { display: none; } }
  @media (prefers-reduced-motion: reduce) { #ui { backdrop-filter: none; } }
</style>

<canvas id="c"></canvas>
<div id="load">Loading model…</div>
<div id="ui">
  <header id="hdr">
    <div>
      <h1>Hobby Class, LVL 80.50</h1>
      <div class="sub">Kumarans CBSE Junior Block</div>
    </div>
    <button id="fold" type="button" aria-label="Collapse controls" aria-expanded="true">▾</button>
  </header>
  <div id="body">
    <div class="eyebrow">Seating</div>
    <div class="row seat">
      <button type="button" id="seatLecture" class="on">Lecture</button>
      <button type="button" id="seatActivity">Activity time</button>
    </div>
    <div class="eyebrow">View</div>
    <div class="row">
      <button type="button" data-v="iso">Isometric</button>
      <button type="button" data-v="top">Plan</button>
      <button type="button" data-v="front">Front</button>
      <button type="button" data-v="side">Side</button>
      <button type="button" id="spinBtn">Auto-rotate</button>
    </div>
    <div class="eyebrow">Display</div>
    <label><input type="checkbox" id="wire"> Wireframe</label>
    <label>X-ray <input type="range" id="xray" min="0.15" max="1" step="0.05" value="1"></label>
    <div class="eyebrow">Projector</div>
    <div class="row">
      <button type="button" id="vplay">Play video</button>
      <button type="button" data-v="screen">Look at screen</button>
    </div>
  </div>
</div>
<div id="help">Drag to rotate · Right-drag or two fingers to pan · Scroll to zoom</div>

<video id="vid" src="screen.mp4?v=1791380612" loop muted playsinline preload="auto" hidden></video>
<script src="model.js?v=1791380612"></script>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const bytes = Uint8Array.from(atob(window.HC_GLB_B64), ch => ch.charCodeAt(0));
const MODEL = URL.createObjectURL(new Blob([bytes], { type: 'model/gltf-binary' }));
delete window.HC_GLB_B64;
const dark = () => matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light' || document.documentElement.dataset.theme === 'dark';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
function applyTheme() { scene.background = new THREE.Color(dark() ? 0x14171b : 0xe9ecef); }
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 500);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a80, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
scene.add(sun);

const vid = document.getElementById('vid');
const vtex = new THREE.VideoTexture(vid); vtex.colorSpace = THREE.SRGBColorSpace;
const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.06, 1.156), new THREE.MeshBasicMaterial({ map: vtex, toneMapped: false }));
screenMesh.position.set(6.80, 1.906, -10.40); scene.add(screenMesh);
const vplay = document.getElementById('vplay');
function syncVideoUI() { vplay.textContent = vid.paused ? 'Play video' : 'Pause video'; }
vplay.onclick = () => { (vid.paused ? vid.play() : Promise.resolve(vid.pause())).catch(() => {}).finally(syncVideoUI); };
vid.addEventListener('play', syncVideoUI); vid.addEventListener('pause', syncVideoUI);

const box = new THREE.Box3(), center = new THREE.Vector3(), size = new THREE.Vector3();

// ---- seating layouts: 'lecture' (rows facing the teacher) and 'activity' (one chair per table side) ----
let layouts = null, chairNodes = [], seating = 'lecture', tweens = [];
fetch('arrangements.json?v=1791380774').then(r => r.json()).then(d => { layouts = d; bindChairs(); }).catch(() => {});
function bindChairs() {
  if (!layouts || !modelRoot) return;
  chairNodes = [];
  for (const name in layouts) { const o = modelRoot.getObjectByName(name); if (o) chairNodes.push({ o, l: layouts[name] }); }
  let saved = 'lecture'; try { saved = localStorage.getItem('hc3d-seating') || 'lecture'; } catch {}
  setSeating(saved, false);
}
function matTo(arr, pos, quat, scl) { new THREE.Matrix4().fromArray(arr).decompose(pos, quat, scl); }
function setSeating(mode, animate = true) {
  if (!chairNodes.length) return;
  seating = mode; tweens = [];
  document.getElementById('seatLecture').classList.toggle('on', mode === 'lecture');
  document.getElementById('seatActivity').classList.toggle('on', mode === 'activity');
  try { localStorage.setItem('hc3d-seating', mode); } catch {}
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  for (const { o, l } of chairNodes) {
    const p1 = new THREE.Vector3(), q1 = new THREE.Quaternion(), s1 = new THREE.Vector3();
    matTo(l[mode], p1, q1, s1);
    if (!animate || reduce) { o.position.copy(p1); o.quaternion.copy(q1); o.scale.copy(s1); continue; }
    tweens.push({ o, p0: o.position.clone(), q0: o.quaternion.clone(), p1, q1, s1, t0: performance.now() });
  }
}
function stepTweens(now) {
  if (!tweens.length) return;
  const D = 900;
  tweens = tweens.filter(({ o, p0, q0, p1, q1, s1, t0 }) => {
    let k = Math.min(1, (now - t0) / D); const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    o.position.lerpVectors(p0, p1, e); o.quaternion.slerpQuaternions(q0, q1, e); o.scale.copy(s1);
    o.position.y += Math.sin(e * Math.PI) * 0.06;   // small lift while moving
    return k < 1;
  });
}
document.getElementById('seatLecture').onclick = () => setSeating('lecture');
document.getElementById('seatActivity').onclick = () => setSeating('activity');
let modelRoot = null;
let radius = 10;
const materials = new Set();

new GLTFLoader().load(MODEL, (gltf) => {
  const root = gltf.scene;
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m) => { if (!m) return; materials.add(m); m.side = THREE.DoubleSide; if (m.transparent) o.castShadow = false; });
  });
  scene.add(root); modelRoot = root; bindChairs();

  box.setFromObject(root); box.getCenter(center); box.getSize(size);
  radius = Math.max(size.x, size.y, size.z);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(radius * 8, radius * 8), new THREE.ShadowMaterial({ opacity: 0.18 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(center.x, box.min.y - 0.002, center.z); ground.receiveShadow = true; scene.add(ground);
  const grid = new THREE.GridHelper(Math.ceil(radius * 4), Math.ceil(radius * 4), 0x9aa3ad, 0x9aa3ad);
  grid.material.opacity = 0.25; grid.material.transparent = true;
  grid.position.set(center.x, box.min.y - 0.001, center.z); scene.add(grid);

  sun.position.set(center.x - radius, center.y + radius * 1.6, center.z - radius * 0.8);
  sun.target.position.copy(center); scene.add(sun.target);
  const s = radius * 1.2;
  Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 0.5, far: radius * 6 });
  sun.shadow.camera.updateProjectionMatrix();

  camera.near = radius / 500; camera.far = radius * 50; camera.updateProjectionMatrix();
  controls.minDistance = radius * 0.05; controls.maxDistance = radius * 6;
  document.getElementById('load').remove();
  setView('iso');
  vid.play().catch(() => {}); syncVideoUI();
}, (ev) => {
  if (ev.total) document.getElementById('load').textContent = `Loading model… ${Math.round(ev.loaded / ev.total * 100)}%`;
}, (e) => { document.getElementById('load').textContent = 'The model could not be loaded. Reload the page to try again.'; console.error(e); });

function setView(v) {
  if (v === 'screen') { camera.position.set(6.8, 1.7, -6.2); controls.target.set(6.8, 1.9, -10.4); controls.update(); return; }
  const d = radius * 1.15;
  const off = {
    iso:   new THREE.Vector3(-d * 0.8, d * 0.75, d * 0.9),
    top:   new THREE.Vector3(0, d * 1.6, 0.001),
    front: new THREE.Vector3(0, d * 0.25, d * 1.4),
    side:  new THREE.Vector3(d * 1.4, d * 0.25, 0),
  }[v];
  camera.position.copy(center).add(off);
  controls.target.copy(center); controls.update();
}
document.querySelectorAll('.row button[data-v]').forEach(b => b.onclick = () => setView(b.dataset.v));
const spinBtn = document.getElementById('spinBtn');
spinBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; spinBtn.classList.toggle('on', controls.autoRotate); spinBtn.setAttribute('aria-pressed', String(controls.autoRotate)); };
spinBtn.setAttribute('aria-pressed', 'false');
document.getElementById('wire').onchange = e => materials.forEach(m => m.wireframe = e.target.checked);
document.getElementById('xray').oninput = e => {
  const v = parseFloat(e.target.value);
  materials.forEach(m => { m.userData.baseOpacity ??= m.opacity; m.userData.baseT ??= m.transparent;
    m.transparent = v < 1 || m.userData.baseT; m.opacity = v < 1 ? Math.min(v, m.userData.baseOpacity) : m.userData.baseOpacity; m.depthWrite = v >= 1; m.needsUpdate = true; });
};
const fold = document.getElementById('fold'), body = document.getElementById('body');
function setFold(open) { body.hidden = !open; fold.textContent = open ? '▾' : '▸'; fold.setAttribute('aria-expanded', String(open)); fold.setAttribute('aria-label', open ? 'Collapse controls' : 'Expand controls'); try { localStorage.setItem('hc3d-fold', open ? '1' : '0'); } catch {} }
document.getElementById('hdr').onclick = () => setFold(body.hidden);
let openInit = true; try { openInit = localStorage.getItem('hc3d-fold') !== '0'; } catch {}
if (innerWidth < 700) openInit = false;
setFold(openInit);

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight, pr = renderer.getPixelRatio();
  if (canvas.width !== Math.floor(w * pr) || canvas.height !== Math.floor(h * pr)) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
}
renderer.setAnimationLoop((now) => { resize(); stepTweens(now); controls.update(); renderer.render(scene, camera); });
</script>

</html>
